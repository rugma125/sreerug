<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Modern, fast, and responsive scientific calculator application with calculation history.">
  <title>Modern Calculator</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-wrapper" role="main">
    <div class="calculator-container" role="region" aria-label="Calculator">
      
      <!-- Top Bar / Indicators -->
      <div class="calc-header">
        <div class="mode-badges" aria-label="Calculator Mode Indicators">
          <span class="badge" id="angle-indicator" aria-label="Angle Mode: Degree">DEG</span>
          <span class="badge" id="mode-indicator" aria-label="Calculator Layout: Basic">BASIC</span>
        </div>
        <button id="history-toggle-btn" class="icon-btn" aria-label="Toggle History Panel" title="History">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
      </div>

      <!-- Display Area -->
      <div class="display-area" id="display-area" role="region" aria-label="Calculator Display">
        <div class="expression-line" id="expression-display" aria-label="Expression" aria-live="polite"></div>
        <div class="result-line" id="result-display" aria-label="Result" aria-live="polite">0</div>
      </div>

      <!-- Quick Toggles Toolbar -->
      <div class="toolbar" role="toolbar" aria-label="Calculator Controls Toolbar">
        <button class="btn btn-tool" id="btn-angle" aria-label="Toggle Angle Mode Degree or Radian">DEG</button>
        <button class="btn btn-tool" id="btn-mode" aria-label="Toggle Layout Basic or Scientific">Sci</button>
        <button class="btn btn-tool" id="btn-clear-history" aria-label="Clear Calculation History">Clear History</button>
      </div>

      <!-- Scientific Keypad Panel (Collapsible/Toggleable) -->
      <div class="keypad-scientific hidden" id="scientific-keypad" role="group" aria-label="Scientific Functions Keypad">
        <button class="btn btn-sci" data-action="sin" aria-label="Sine">sin</button>
        <button class="btn btn-sci" data-action="cos" aria-label="Cosine">cos</button>
        <button class="btn btn-sci" data-action="tan" aria-label="Tangent">tan</button>
        <button class="btn btn-sci" data-action="ln" aria-label="Natural Logarithm">ln</button>
        <button class="btn btn-sci" data-action="log" aria-label="Logarithm Base 10">log</button>

        <button class="btn btn-sci" data-action="sqrt" aria-label="Square Root">√x</button>
        <button class="btn btn-sci" data-action="pow" aria-label="Exponent Power x to y">x^y</button>
        <button class="btn btn-sci" data-action="sqr" aria-label="Square x squared">x²</button>
        <button class="btn btn-sci" data-action="recip" aria-label="Reciprocal 1 over x">1/x</button>
        <button class="btn btn-sci" data-action="fact" aria-label="Factorial x factorial">x!</button>

        <button class="btn btn-sci" data-action="pi" aria-label="Constant Pi">π</button>
        <button class="btn btn-sci" data-action="paren-open" aria-label="Open Parenthesis">(</button>
        <button class="btn btn-sci" data-action="paren-close" aria-label="Close Parenthesis">)</button>
        <button class="btn btn-sci" data-action="percent" aria-label="Percentage">%</button>
        <button class="btn btn-sci" data-action="negate" aria-label="Toggle Plus Minus">±</button>
      </div>

      <!-- Basic Keypad Panel -->
      <div class="keypad-basic" id="basic-keypad" role="group" aria-label="Basic Keypad">
        <button class="btn btn-control btn-ac" id="btn-ac" data-action="ac" aria-label="All Clear">AC</button>
        <button class="btn btn-control" id="btn-del" data-action="del" aria-label="Delete last character">DEL</button>
        <button class="btn btn-operator" data-op="/" aria-label="Divide">÷</button>
        <button class="btn btn-operator" data-op="*" aria-label="Multiply">×</button>

        <button class="btn btn-num" data-num="7" aria-label="7">7</button>
        <button class="btn btn-num" data-num="8" aria-label="8">8</button>
        <button class="btn btn-num" data-num="9" aria-label="9">9</button>
        <button class="btn btn-operator" data-op="-" aria-label="Subtract">−</button>

        <button class="btn btn-num" data-num="4" aria-label="4">4</button>
        <button class="btn btn-num" data-num="5" aria-label="5">5</button>
        <button class="btn btn-num" data-num="6" aria-label="6">6</button>
        <button class="btn btn-operator" data-op="+" aria-label="Add">+</button>

        <button class="btn btn-num" data-num="1" aria-label="1">1</button>
        <button class="btn btn-num" data-num="2" aria-label="2">2</button>
        <button class="btn btn-num" data-num="3" aria-label="3">3</button>
        <button class="btn btn-equals" id="btn-equals" data-action="equals" aria-label="Equals">=</button>

        <button class="btn btn-num btn-zero" data-num="0" aria-label="0">0</button>
        <button class="btn btn-num" data-num="." aria-label="Decimal Point">.</button>
      </div>

    </div>

    <!-- History Dock / Drawer -->
    <aside class="history-panel" id="history-panel" aria-label="Calculation History Panel">
      <div class="history-header">
        <h3>Calculation History</h3>
        <button id="close-history-btn" class="icon-btn" aria-label="Close History Panel">✕</button>
      </div>
      <div class="history-list" id="history-list" aria-live="polite">
        <div class="history-empty">No history yet</div>
      </div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
